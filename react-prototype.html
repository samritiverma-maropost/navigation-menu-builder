<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Navigation menu builder · stakeholder prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" />
  <link rel="stylesheet" href="react-prototype.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#1e2533",
            rail: "#1e2533",
            "rail-active": "#535963",
            berry: "#03b6fc",
            chip: "#cbdae8",
            ok: "#29993e",
            err: "#b00020",
            l1: "#29993e",
            l2: "#0288d1",
            l3: "#f53bad",
          },
          fontFamily: { sans: ["Roboto", "Helvetica Neue", "Helvetica", "Arial", "sans-serif"] },
          boxShadow: {
            btn: "0 1px 1.5px rgba(0,0,0,.2), 0 2px 0.5px rgba(0,0,0,.12), 0 1px 0.5px rgba(0,0,0,.14)",
            menu: "0 5px 5px -3px rgba(0,0,0,.2), 0 8px 10px 1px rgba(0,0,0,.14), 0 3px 14px 2px rgba(0,0,0,.12)",
          },
        },
      },
    };
  </script>
  <style>
    body { margin: 0; font-family: Roboto, Helvetica, Arial, sans-serif; }
    .mdi { font-size: 20px; line-height: 1; }
    input[type="checkbox"] { accent-color: #1e2533; }
    .indeterminate { accent-color: #1e2533; }
  </style>
</head>
<body class="bg-[#fbfbfb] text-[rgba(0,0,0,0.87)] antialiased">
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.10/babel.min.js"></script>
  <script type="text/babel" src="react-prototype.jsx"></script>
</body>
</html>
